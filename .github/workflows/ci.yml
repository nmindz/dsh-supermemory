name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

      - run: pnpm run build

      # The published tarball is lib/ plus the runtime assets the plugin reads
      # at runtime; a missing skill or template only shows up here.
      - name: Verify package contents
        run: |
          pnpm pack
          tar tzf dsh-supermemory-*.tgz | sort | tee /tmp/contents.txt
          for required in \
            package/lib/index.mjs \
            package/lib/mcp-proxy.mjs \
            package/lib/statusline.mjs \
            package/cordis.patch.yml \
            package/skills/supermemory-context-gatherer/SKILL.md \
            package/templates/auth-success.html \
            package/templates/auth-error.html
          do
            grep -qx "$required" /tmp/contents.txt || { echo "missing from tarball: $required"; exit 1; }
          done
